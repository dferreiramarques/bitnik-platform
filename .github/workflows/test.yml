# Testes e simulação curta de cada jogo, em cada push e pull request.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes e simulações
    runs-on: ubuntu-latest
    # Um teste pendurado (servidor que ficou aberto) não deve prender o runner meia hora.
    timeout-minutes: 10
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Node (versão do .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Correr os testes
        run: npm test
        timeout-minutes: 5

      - name: Simular o Catania
        run: npm run simulate -- catania 100

      - name: Simular o Bulbous
        run: npm run simulate -- bulbous 100

      - name: Simular a Praia das Percebes
        run: npm run simulate -- praia-das-percebes 100

      - name: Simular o Nine Oils
        run: npm run simulate -- nine-oils 100

      - name: Simular as Capivaras
        run: npm run simulate -- capivaras 100
